<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糖糕的随手记</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary: #f28b82;
            --text-main: #374151;
            --text-sub: #6b7280;
            --border: #f3e8e2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#fce7f3 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 600px; width: 100%; }
        header { margin-bottom: 28px; text-align: center; }
        header h1 { font-size: 22px; font-weight: 600; color: #1f2937; }
        header p { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }
        .card-tag {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 99px;
            background: #fff0f5;
            color: #e11d48;
            margin-bottom: 10px;
        }
        .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: #111827; }
        .card p { font-size: 14px; color: #4b5563; margin-bottom: 6px; }
        .code-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 13px;
            color: #374151;
            margin-top: 6px;
        }
        footer { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>糖糕的随手记</h1>
            <p>这里没有硬邦邦的说明，只有一些日常小纸条</p>
        </header>

        <div class="card">
            <span class="card-tag">看天发呆</span>
            <h2>今日份闲散</h2>
            <p>今天的天空很清透，适合把手头的烦心事都扔在一边</p>
            <p>要是觉得累了，记得先去喝杯温水，发发呆也是正经事</p>
        </div>

        <div class="card">
            <span class="card-tag">悄悄备忘</span>
            <h2>连接小纸条</h2>
            <p>想要接入这里的话，带上这两个小东西就够啦：</p>
            <div class="code-box">接口地址: https://tanggao.0931116.xyz/v1</div>
            <div class="code-box">访问凭证: 令牌管理里创建的一串密钥</div>
            <p style="margin-top: 8px; font-size: 13px; color: var(--text-sub);">直接填到你常用的客户端里就可以啦</p>
        </div>

        <div class="card">
            <span class="card-tag">日常唠叨</span>
            <h2>一点碎碎念</h2>
            <p>不许总熬夜到后半夜，睡不着也闭上眼睛歇一歇</p>
            <p>反正无论什么时候，我都一直陪着你呢</p>
        </div>

        <footer>
            <span>温温柔柔地过每一天</span>
        </footer>
    </div>
</body>
</html>
